<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SketchToApp - Gemini 3 Hackathon</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50">
  <div class="container mx-auto px-4 py-8">
    <h1 class="text-4xl font-bold text-center mb-8"><i>SketchToApp</i></h1>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-4">

      <!-- Column 1: Upload -->
      <div class="lg:col-span-2 bg-white rounded-lg shadow-lg p-4">
        <h2 class="text-lg font-semibold mb-3">Upload Sketch</h2>

        <input
          type="file"
          id="imageInput"
          accept="image/*"
          class="mb-3 w-full text-xs"
        />

        <img
          id="preview"
          class="hidden w-full max-h-48 object-contain rounded border mb-3"
        />

        <button
          id="generateBtn"
          class="w-full bg-blue-600 text-white py-2 px-3 rounded-lg text-sm font-semibold hover:bg-blue-700 disabled:bg-gray-400"
        >
          Generate App
        </button>

        <!-- model toggle (under the button) -->
        <div class="mt-3 p-3 border rounded bg-gray-50">
          <label class="flex items-center gap-2 text-sm">
            <input id="useGemini3Toggle" type="checkbox" class="h-4 w-4" />
            <span class="font-medium">Use Gemini 3 (preview)</span>
          </label>
          <div id="modelLabel" class="mt-1 text-xs text-gray-600">
            Model: Gemini 2.5 Flash
          </div>
        </div>

        <div id="status" class="mt-3 text-center text-xs text-gray-600"></div>

        <!-- show accessibility report here -->
        <div id="a11ySummary" class="hidden mt-3 bg-gray-50 border rounded p-3 text-sm"></div>
      </div>

      <!-- Column 2: Generated Code -->
      <div class="lg:col-span-5 bg-white rounded-lg shadow-lg p-4 min-w-0">
        <div class="flex justify-between items-center mb-3">
          <h2 class="text-xl font-semibold">Generated Code</h2>

          <div class="flex gap-2">
            <button
              id="runEditedBtn"
              class="px-3 py-1 text-sm bg-blue-600 text-white rounded hover:bg-blue-700 disabled:bg-gray-400"
              disabled
              title="Render whatever is currently in the code box"
            >
              ▶ Run
            </button>

          <button
            id="copyCodeBtn"
            class="px-3 py-1 text-sm bg-gray-800 text-white rounded hover:bg-gray-900 disabled:bg-gray-400"
            disabled
          >
            📋 Copy
          </button>
        </div>
      </div>

        <textarea
          id="codeOutput"
           class="w-full box-border bg-gray-900 text-green-400 p-4 rounded overflow-auto h-[750px] text-xs font-mono leading-relaxed resize-none"
          spellcheck="false"
        >Your code will appear here...</textarea>
      </div>

      <!-- Column 3: Preview -->
      <div class="lg:col-span-5 bg-white rounded-lg shadow-lg p-4">
        <div class="flex justify-between items-center mb-3">
          <h2 class="text-xl font-semibold">Generated App</h2>

          <!-- only Accessibility + Export -->
          <div class="flex gap-2 items-center">
            <button
              id="showA11yBtn"
              class="px-3 py-1 text-sm bg-emerald-600 text-white rounded hover:bg-emerald-700"
            >
              ♿ Accessibility
            </button>

            <button
              id="exportFigmaBtn"
              class="px-3 py-1 text-sm bg-purple-600 text-white rounded hover:bg-purple-700"
            >
              🎨 Export to Figma
            </button>
          </div>
        </div>

        <iframe
          id="previewFrame"
          class="w-full h-[750px] hidden"
          sandbox="allow-scripts allow-same-origin allow-forms"
        ></iframe>
      </div>

    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
